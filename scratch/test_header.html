<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Minimalist Header Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Ambient Background Mesh */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 300px;
      background: radial-gradient(50% 50% at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header Container */
    .navbar-futuristic {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      transition: all 0.25s ease;
    }

    .navbar-futuristic .container {
      max-width: 1440px;
      margin: 0 auto;
      height: 62px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 1. Futuristic Brand Identity */
    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      user-select: none;
    }

    .brand-glyph-frame {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .brand-glyph-svg {
      width: 36px;
      height: 36px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-group:hover .brand-glyph-svg {
      transform: scale(1.05) rotate(-2deg);
    }

    .brand-text-lockup {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: #090d16;
      letter-spacing: -0.035em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    .brand-title .accent-gen {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-left: 1px;
    }

    .brand-badge-net {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: #059669;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.22);
      border-radius: 4px;
      padding: 1.5px 5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* 2. Floating Segmented Navigation Capsule */
    .nav-segmented-capsule {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(241, 245, 249, 0.7);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 9999px;
      padding: 3.5px 4px;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .nav-capsule-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #64748b;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .nav-capsule-item:hover {
      color: #0f172a;
      background: rgba(255, 255, 255, 0.6);
    }

    .nav-capsule-item.active {
      color: #0f172a;
      font-weight: 600;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .nav-capsule-item.active::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    /* 3. Right Header Actions Wrap */
    .nav-actions-futuristic {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Language Switcher Pill (Super Minimalist Globe + Code) */
    .lang-pill-wrap {
      position: relative;
    }

    .btn-lang-pill {
      height: 34px;
      padding: 0 11px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(226, 232, 240, 0.9);
      color: #334155;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .btn-lang-pill:hover {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.06);
    }

    .lang-globe-icon {
      color: #64748b;
      stroke-width: 1.8;
      flex-shrink: 0;
    }

    .lang-code-text {
      letter-spacing: 0.02em;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .lang-chevron-icon {
      color: #94a3b8;
      stroke-width: 2.2;
      transition: transform 0.2s ease;
    }

    /* Auth Buttons */
    .btn-login-ghost {
      height: 34px;
      padding: 0 14px;
      border-radius: 9999px;
      background: transparent;
      border: none;
      color: #475569;
      font-size: 0.8125rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .btn-login-ghost:hover {
      color: #0f172a;
      background: rgba(15, 23, 42, 0.05);
    }

    .btn-signup-futuristic {
      height: 34px;
      padding: 0 16px;
      border-radius: 9999px;
      background: #090d16;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-signup-futuristic::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, transparent 100%);
      pointer-events: none;
    }

    .btn-signup-futuristic:hover {
      background: #111827;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .btn-signup-futuristic svg {
      transition: transform 0.2s ease;
    }

    .btn-signup-futuristic:hover svg {
      transform: translateX(2px);
    }

    /* Content Area to Test Context */
    .hero-mock {
      max-width: 1000px;
      margin: 80px auto;
      text-align: center;
      padding: 0 20px;
    }

    .hero-mock h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 14px;
      color: #090d16;
    }

    .hero-mock p {
      font-size: 1.1rem;
      color: #64748b;
      max-width: 580px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Futuristic Minimalist Header -->
  <header class="navbar-futuristic">
    <div class="container">
      
      <!-- 1. Brand Identity -->
      <a href="#" class="brand-group">
        <div class="brand-glyph-frame">
          <svg class="brand-glyph-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="tokenBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0b1120" />
                <stop offset="100%" stop-color="#020617" />
              </linearGradient>
              <linearGradient id="luminousEmerald" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00F59B" />
                <stop offset="50%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
            </defs>
            <!-- Squircle Outer Shell -->
            <rect width="36" height="36" rx="9" fill="url(#tokenBg)" />
            <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
            
            <!-- Geometric Invoice Glyph: Clean Futuristic Planes -->
            <path d="M10 9C10 7.89543 10.8954 7 12 7H21L26 12V27C26 28.1046 25.1046 29 24 29H12C10.8954 29 10 28.1046 10 27V9Z" fill="url(#luminousEmerald)" />
            <!-- Origami Fold -->
            <path d="M21 7V11C21 11.5523 21.4477 12 22 12H26L21 7Z" fill="#A7F3D0" />
            <!-- Laser Ledger Lines -->
            <rect x="13.5" y="15" width="9" height="1.8" rx="0.9" fill="#064E3B" />
            <rect x="13.5" y="18.5" width="6.5" height="1.8" rx="0.9" fill="#064E3B" />
            <!-- Micro Status Node / Security Chip -->
            <circle cx="20.5" cy="23.5" r="2.2" fill="#FFFFFF" />
            <path d="M19.2 23.5L20.1 24.4L21.8 22.6" stroke="#059669" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="brand-text-lockup">
          <span class="brand-title">Invoice<span class="accent-gen">Gen</span></span>
          <span class="brand-badge-net">.NET</span>
        </div>
      </a>

      <!-- 2. Segmented Navigation Capsule -->
      <nav class="nav-segmented-capsule" aria-label="Main Navigation">
        <a href="#" class="nav-capsule-item active">Invoice Generator</a>
        <a href="#" class="nav-capsule-item">Templates</a>
        <a href="#" class="nav-capsule-item">Features</a>
        <a href="#" class="nav-capsule-item">Pricing</a>
      </nav>

      <!-- 3. Right Header Actions -->
      <div class="nav-actions-futuristic">
        <!-- Language Switcher Pill -->
        <div class="lang-pill-wrap">
          <button type="button" class="btn-lang-pill" id="protoLangBtn">
            <svg class="lang-globe-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span class="lang-code-text">EN</span>
            <svg class="lang-chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>

        <!-- Log In Ghost Button -->
        <a href="#" class="btn-login-ghost">Log In</a>

        <!-- Futuristic Sign Up Button -->
        <a href="#" class="btn-signup-futuristic">
          <span>Sign Up Free</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

    </div>
  </header>

  <div class="hero-mock">
    <h1>The Super Minimalist, Futuristic Invoice Platform</h1>
    <p>Craft high-conversion vector invoices in real-time. Zero bloated configuration, 100% private in-browser generation.</p>
  </div>
</body>
</html>
