<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <linearGradient id="vaultBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Emerald Glow Filter -->
    <filter id="vaultGlow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Precision Squircle Token Container -->
  <rect width="48" height="48" rx="12" fill="url(#vaultBg)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />

  <!-- Precision Isometric Hexagon / Vault Glyph -->
  <g filter="url(#vaultGlow)">
    <!-- Outer Hexagon Boundary -->
    <path d="M24 10L37 17.5V32.5L24 40L11 32.5V17.5L24 10Z" stroke="#10B981" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Top-To-Center Ridge -->
    <path d="M24 10V25L37 17.5" stroke="#10B981" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Left-To-Center Ridge -->
    <path d="M24 25L11 17.5" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Bottom-To-Center Ridge -->
    <path d="M24 25V40" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
    
    <!-- Luminous Core Node -->
    <circle cx="24" cy="25" r="3.2" fill="#00F59B" />
    <circle cx="24" cy="25" r="1.5" fill="#FFFFFF" />
  </g>
</svg>