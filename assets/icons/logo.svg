<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Vibrant Emerald Brand Gradient -->
    <linearGradient id="igBrandBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#00C875" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>

    <!-- Origami Fold Mint Gradient -->
    <linearGradient id="igFoldGrad" x1="27" y1="9" x2="35" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Smooth Drop Shadow for Document Elevation -->
    <filter id="igDocShadow" x="10" y="7" width="28" height="35" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Brand Token Container -->
  <rect width="48" height="48" rx="13" fill="url(#igBrandBg)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="12.5" stroke="rgba(255, 255, 255, 0.32)" stroke-width="1" />

  <!-- Clean Crisp White Invoice Document -->
  <g filter="url(#igDocShadow)">
    <!-- Document Base Paper -->
    <path d="M14 11.5C14 10.1193 15.1193 9 16.5 9H27L35 17V36.5C35 37.8807 33.8807 39 32.5 39H16.5C15.1193 39 14 37.8807 14 36.5V11.5Z" fill="#FFFFFF" />
    <!-- Precision Folded Corner -->
    <path d="M27 9V15C27 16.1046 27.8954 17 29 17H35L27 9Z" fill="url(#igFoldGrad)" />
    <!-- Ledger Data Line 1 (Header/Title) -->
    <rect x="18" y="21" width="13" height="2.5" rx="1.25" fill="#0F172A" />
    <!-- Ledger Data Line 2 (Line Items) -->
    <rect x="18" y="26" width="10" height="2" rx="1" fill="#94A3B8" />
    <!-- Ledger Data Line 3 (Total Accent) -->
    <rect x="18" y="30.5" width="7.5" height="2" rx="1" fill="#00C875" />
  </g>

  <!-- Luminous Instant Generation Star Badge -->
  <circle cx="33.5" cy="34.5" r="4.8" fill="#047857" stroke="#FFFFFF" stroke-width="1.2" />
  <path d="M33.5 31.8L34.3 33.7L36.2 34.5L34.3 35.3L33.5 37.2L32.7 35.3L30.8 34.5L32.7 33.7L33.5 31.8Z" fill="#FDE047" />
  <circle cx="33.5" cy="34.5" r="0.8" fill="#FFFFFF" />
</svg>