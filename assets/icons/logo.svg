<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Deep Obsidian Matrix Background -->
    <linearGradient id="tokenBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Luminous Cyber-Emerald Gradient -->
    <linearGradient id="luminousEmerald" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Flap Fold Gradient -->
    <linearGradient id="flapAccent" x1="28" y1="9" x2="35" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="emeraldGlow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Precision Squircle Outer Token -->
  <rect width="48" height="48" rx="12" fill="url(#tokenBg)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />

  <!-- Futuristic Geometric Invoice Glyph -->
  <g filter="url(#emeraldGlow)">
    <path d="M13 11C13 9.89543 13.8954 9 15 9H27L35 17V36C35 37.1046 34.1046 38 33 38H15C13.8954 38 13 37.1046 13 36V11Z" fill="url(#luminousEmerald)" />
    <!-- Origami Fold Corner -->
    <path d="M27 9V15C27 16.1046 27.8954 17 29 17H35L27 9Z" fill="url(#flapAccent)" />
  </g>

  <!-- Laser Cut Ledger Elements -->
  <rect x="18" y="21" width="12" height="2.4" rx="1.2" fill="#044E37" />
  <rect x="18" y="25.8" width="8" height="2.4" rx="1.2" fill="#044E37" />

  <!-- Precision Verified Node / Security Seal -->
  <circle cx="28.5" cy="32" r="3.2" fill="#FFFFFF" />
  <path d="M27 32L28.1 33.1L30.2 31" stroke="#059669" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
</svg>